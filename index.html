<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên - Nhóm WebSTU</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; flex: 1; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; }
        
        .btn-add { background-color: #28a745; }
        .btn-seed { background-color: #6f42c1; } /* Nút thêm nhanh danh sách nhóm */
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>Quản Lý Danh Sách Sinh Viên - Nhóm WebSTU</h2>

    <div class="controls">
        <div style="margin-bottom: 10px;">
<!-- test -->
            DH52200824	Trần Minh	Kha <br>
            DH52201237	Lê Trọng	Phúc <br>
            DH52200558	Đoàn Trường	Duy <br>
            DH52200953	Phạm Tuấn	Kiệt <br>
            DH52201440	Trần Anh	Thắng <br>
        </div>

        <div class="form-group">
            <input type="hidden" id="student-id"> 
            <input type="text" id="name" placeholder="Tên sinh viên...">
            <input type="text" id="phone" placeholder="Số điện thoại...">
            <input type="text" id="avatar" placeholder="Link ảnh (URL)...">
            <button id="btn-save" class="btn-add" onclick="handleSave()">Lưu Thông Tin</button>
        </div>

        <div class="form-group">
            <input type="text" id="search-input" placeholder="Tìm kiếm theo tên..." oninput="searchStudent()">
        </div>
    </div>

    <div id="loading">Đang tải dữ liệu...</div>
    <table id="student-table" style="display: none;">
        <thead>
            <tr>
                <th>Ảnh</th>
                <th>Họ Tên</th>
                <th>Điện Thoại</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody id="student-list"></tbody>
    </table>
</div>

<script>
    const API_URL = "https://6985932a6964f10bf253a58c.mockapi.io/sinhvien";
    let allStudents = [];

    // Danh sách 5 thành viên bạn yêu cầu
    const groupMembers = [
        { name: "DH52200824 - Trần Minh Kha", phone: "0901234xxx", avatar: "https://i.pravatar.cc/150?u=kha" },
        { name: "DH52201237 - Lê Trọng Phúc", phone: "0902345xxx", avatar: "https://i.pravatar.cc/150?u=phuc" },
        { name: "DH52200558 - Đoàn Trường Duy", phone: "0903456xxx", avatar: "https://i.pravatar.cc/150?u=duy" },
        { name: "DH52200953 - Phạm Tuấn Kiệt", phone: "0904567xxx", avatar: "https://i.pravatar.cc/150?u=kiet" },
        { name: "DH52201440 - Trần Anh Thắng", phone: "0905678xxx", avatar: "https://i.pravatar.cc/150?u=thang" }
    ];

    // Hàm tự động thêm 5 người vào API
    async function seedGroupData() {
        if(!confirm("Bạn có muốn thêm nhanh 5 thành viên nhóm vào danh sách không?")) return;
        
        document.getElementById('loading').innerText = "Đang khởi tạo danh sách nhóm...";
        document.getElementById('loading').style.display = 'block';

        for (const person of groupMembers) {
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(person)
            });
        }
        alert("Đã thêm thành công 5 thành viên!");
        fetchStudents();
    }

    async function fetchStudents() {
        try {
            const res = await fetch(API_URL);
            allStudents = await res.json();
            renderTable(allStudents);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('student-table').style.display = 'table';
        } catch (error) {
            document.getElementById('loading').innerText = "Lỗi tải dữ liệu hoặc API chưa sẵn sàng!";
        }
    }

    function renderTable(data) {
        const list = document.getElementById('student-list');
        list.innerHTML = "";
        data.forEach(sv => {
            list.innerHTML += `
                <tr>
                    <td><img src="${sv.avatar}" onerror="this.src='https://via.placeholder.com/40'"></td>
                    <td>${sv.name}</td>
                    <td>${sv.phone}</td>
                    <td>
                        <button class="btn-edit" onclick="editStudent('${sv.id}', '${sv.name}', '${sv.phone}', '${sv.avatar}')">Sửa</button>
                        <button class="btn-delete" onclick="deleteStudent('${sv.id}')">Xóa</button>
                    </td>
                </tr>
            `;
        });
    }

    async function handleSave() {
        const id = document.getElementById('student-id').value;
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const avatar = document.getElementById('avatar').value || "https://via.placeholder.com/150";

        if (!name || !phone) return alert("Vui lòng nhập tên và SĐT!");

        const studentData = { name, phone, avatar };
        
        if (id) {
            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(studentData)
            });
        } else {
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(studentData)
            });
        }

        resetForm();
        fetchStudents();
    }

    async function deleteStudent(id) {
        if (confirm("Xóa sinh viên này?")) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchStudents();
        }
    }

    function editStudent(id, name, phone, avatar) {
        document.getElementById('student-id').value = id;
        document.getElementById('name').value = name;
        document.getElementById('phone').value = phone;
        document.getElementById('avatar').value = avatar;
        document.getElementById('btn-save').innerText = "Cập Nhật";
        document.getElementById('btn-save').style.backgroundColor = "#ffc107";
    }

    function searchStudent() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
        const filtered = allStudents.filter(sv => sv.name.toLowerCase().includes(keyword));
        renderTable(filtered);
    }

    function resetForm() {
        document.getElementById('student-id').value = "";
        document.getElementById('name').value = "";
        document.getElementById('phone').value = "";
        document.getElementById('avatar').value = "";
        document.getElementById('btn-save').innerText = "Lưu Thông Tin";
        document.getElementById('btn-save').style.backgroundColor = "#28a745";
    }

    fetchStudents();
</script>

</body>
</html>
